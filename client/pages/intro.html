<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aariva</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    #intro-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
   #skip-btn {
  position: fixed;
  bottom: 40px; right: 40px;
  z-index: 3;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  border: 2px solid #fff;
  padding: 12px 28px;
  font-size: 15px;
  font-family: 'Segoe UI', sans-serif;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
#skip-btn:hover { background: rgba(0,0,0,0.95); transform: scale(1.04); }
    body.fade-out { animation: fadeOut 0.6s ease forwards; }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
  <script>
  const video = document.getElementById('intro-video');
  video.playbackRate = 0.75; // Slow down the video for a more cinematic feel

  function goToLogin() {
    document.body.classList.add('fade-out');
    setTimeout(() => { window.location.href = '/login'; }, 600);
  }

  setTimeout(goToLogin, 3000);

  document.getElementById('skip-btn').addEventListener('click', goToLogin);
</script>
</head>
<body>
  <video id="intro-video" autoplay muted playsinline>
    <source src="/assets/intro.mp4" type="video/mp4" />
  </video>
  <button id="skip-btn">Skip Intro</button>
  <script>
    function goToLogin() {
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = '/login'; }, 600);
    }
    document.getElementById('intro-video').addEventListener('ended', goToLogin);
    document.getElementById('skip-btn').addEventListener('click', goToLogin);
  </script>
</body>
</html>

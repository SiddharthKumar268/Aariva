<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aariva — Register</title>
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" /> 
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo">
        <h1>Aariva</h1>
        <p>Create your account</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your full name" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="role" required>
            <option value="">Select your role</option>
            <option value="applicant">Applicant</option>
            <option value="caseworker">Case Worker</option>
            <option value="doctor">Healthcare Provider</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" id="register-btn" class="btn btn-primary btn-full" style="margin-top:8px">
          Create Account
        </button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
        Already have an account? <a href="/">Sign In</a>
      </p>
    </div>
  </div>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/chatbot.js"></script> 
</body>
</html>
